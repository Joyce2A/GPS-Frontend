<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GPS Frontend</title>

    <!-- Leaflet CSS must be INSIDE the <head> -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
  </head>
  <body>
    <div id="root"></div>

    <!-- Script must stay at the bottom -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
